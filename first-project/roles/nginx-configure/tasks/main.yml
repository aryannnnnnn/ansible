---
# tasks file for roles/nginx-configure
- name: "Install nginx"
  ansible.builtin.apt:
    name: "nginx"
    state: "present"

- name: "Copy .conf files"
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    validate: "nginx -t -c %s"
  notify: "Restart nginx"

- name: "Start nginx"
  ansible.builtin.service:
    name: "nginx"
    state: "started"
    enabled: true
