 services:
   postgres:
     image: postgres:16
     container_name: postgres
     restart: unless-stopped
     environment:
       POSTGRES_USER: notes
       POSTGRES_PASSWORD: "{{ PG_PASSWORD }}"
       POSTGRES_DB: notes
     ports:
       - "5432:5432"
     volumes:
       - postgres_data:/var/lib/postgresql/data
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
       interval: 10s
       timeout: 5s
       retries: 5

 volumes:
   postgres_data: